<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Spectral|Rubik">

    <style>
        .nb {
            background: linear-gradient(to right, #642f0b, chocolate);
            /* Warm Sunset Orange to Peach */
        }

        .nav-link {
            text-shadow: 1px 1px 2px black;
            /* Deep navy blue */
            color: rgb(255, 255, 255);
            /* Dark gray */
            padding: 10px;
            font-size: 20px;
            padding-left: 20px;
            padding-right: 20px;
            font-family: 'rubik', serif;
            margin-left: 10px;
            margin-right: 10px;
        }

        .navbar-brand {
            padding-right: 60px;
            /* Adjust for better mobile view */
            color: orange;
            /* Elegant gold */
            font-family: 'Spectral', serif;
            font-size: 38px;
            text-shadow: 2px 2px 3px black;
            /* Deep navy blue */
            font-weight: bold;
            /* Dark gray */
        }

        .navbar-brand:hover {
            color: lightcoral;
            text-shadow: 1px 1px 3px black;
        }

        .nav-link:hover {
            color: orange;
            /* Golden glow */
        }

        .nav-item.active .nav-link {
            color: lightcoral;
            border-bottom: 2px solid lightcoral;
        }

        .navbar-toggler:hover {
            border: 1px solid lightcoral;
            box-shadow: 0px 0px 5px lightcoral;
        }

        @keyframes cycleImages {

            0%,
            20% {
                opacity: 1;
                z-index: 1;
            }

            25%,
            100% {
                opacity: 0;
                z-index: 0;
            }
        }

        /* Apply the animation for all five images */
        .explore {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            opacity: 0;
            animation: cycleImages 15s infinite;
        }

        /* Add different delays for each image */
        .e1 {
            animation-delay: 0s;
        }

        .e2 {
            animation-delay: 3s;
        }

        .e3 {
            animation-delay: 6s;
        }

        .e4 {
            animation-delay: 9s;
        }

        .e5 {
            animation-delay: 12s;
        }

        .exptitle {
            margin-left: 100px;
        }

        .expimg {
            border: 0;
            width: 100%;
            height: auto;
        }

        .image-container {
            position: relative;
            max-width: 100%;
            background-color: grey;
            margin: 0 auto;
        }

        .cont {
            width: 70%;
            height: auto;
            background-color: rgb(255, 255, 255);
            box-shadow: 10px 10px 15px black;
            padding: 50px;
            display: flex;
            justify-content: space-around;
            margin: 20px;
        }

        .content {
            font-size: 16px;
            font-family: Rubik;
            padding: 30px;
            margin-top: 50px;
            line-height: 1.5;
        }

        .i-title {
            margin: 10px;
            margin-top: 10px;
            margin-bottom: 40px;
            margin-left: 30px;
            border: 0;
            padding: 15px;
            font-family: Spectral, serif;
            font-size: 37px;
            white-space: nowrap;
        }

        .img-hold {
            margin-top: -50px;
        }

        .rate {
            font-size: 16px;
            margin-top: -20px;
            margin-left: 30px;
        }

        .book {
            font-size: 16px;
            margin-top: -20px;
            margin-left: 30px;
        }

        .book:hover {
            cursor: pointer;
            background-color: rgb(112, 108, 102);
        }

        .boss {
            margin-left: 200px;
        }

        @media (max-width: 768px) {
            .cont {
                flex-direction: column;
                padding: 20px;
                width: 90%;
            }

            .i-title {
                font-size: 28px;
                margin-left: 0;
            }

            .img-hold,
            .para-hold {
                width: 100%;
                margin: 0 auto;
                text-align: center;
            }

            .exptitle {
                margin-left: 20px;
                font-size: 28px;
            }

            .boss {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg nb">
        <div class="container-fluid">
            <a class="navbar-brand text-12" href="#">Sojourn</a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item active">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fa-solid fa-plane"></i> Flight</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fa-solid fa-utensils"></i> Food</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fa-solid fa-hotel"></i> Hotels</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fa-solid fa-box"></i> Packages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fa-solid fa-star"></i> Reviews</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fa-solid fa-phone"></i> Contact</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fa-solid fa-user"></i> Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <h1 class="exptitle">Explore top sites</h1>

    <div class="container-fluid boss">
        <div class="image-container">
            <!-- Content for Explore Images here -->
            <div class="explore e1">
                <!-- Semmozhi Poonga content here -->
            </div>
            <div class="explore e2">
                <!-- Vandaloor Zoo content here -->
            </div>
            <div class="explore e3">
                <!-- Marina Beach content here -->
            </div>
            <div class="explore e4">
                <!-- Dakshina Chitra content here -->
            </div>
            <div class="explore e5">
                <!-- Santhome Cathedral content here -->
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll(".book").forEach(button => {
            button.addEventListener("click", () => {
                const title = button.closest(".cont").querySelector(".i-title").innerText;

                fetch('http://localhost:3000/book', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: "John Doe", // Replace with user input if you have it
                        date: new Date().toISOString(),
                        place: title
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message + " (Booking ID: " + data.bookingId + ")");
                    })
                    .catch(error => {
                        console.error("Booking failed:", error);
                        alert("Booking failed.");
                    });
            });
        });
    </script>

    <!-- Swiper JS -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
