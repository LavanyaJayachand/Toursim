<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        button {
            padding: 10px;
            margin: 20px 0;
            background-color: #f44336;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Bookings List</h1>
    <table>
        <thead>
            <tr>
                <th>Booking ID</th>
                <th>Name</th>
                <th>Mobile</th>
                <th>Place</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="bookingsTableBody">
            <!-- Bookings will be populated here dynamically -->
        </tbody>
    </table>

    <button onclick="clearAllBookings()">Clear All Bookings</button>

    <script>
        // Function to fetch and display booking data
        function fetchBookings() {
            fetch('http://localhost:3000/bookings')
                .then(response => response.json())
                .then(bookings => {
                    const tableBody = document.getElementById('bookingsTableBody');
                    tableBody.innerHTML = ''; // Clear existing rows

                    bookings.forEach(booking => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${booking.bookingId}</td>
                            <td>${booking.name}</td>
                            <td>${booking.mobile}</td>
                            <td>${booking.place}</td>
                            <td>${new Date(booking.date).toLocaleString()}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => console.error('Error fetching bookings:', error));
        }

        // Function to clear all bookings
        function clearAllBookings() {
            fetch('http://localhost:3000/clear-bookings', {
                method: 'GET'
            })
            .then(response => {
                if (response.ok) {
                    fetchBookings(); // Refresh table after clearing
                } else {
                    alert('Error clearing bookings');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Failed to connect to the server.');
            });
        }

        // Initial fetch of bookings data when page loads
        fetchBookings();
    </script>
</body>
</html>
